<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <!-- Modern Minimalist Font & Style Configurations -->
    <style>
      .bg { fill: #f7f9fa; rx: 16px; }
      .box-bg { fill: #ffffff; stroke: #e1e4e6; stroke-width: 1px; rx: 12px; filter: drop-shadow(0px 4px 12px rgba(0,0,0,0.015)); }
      .box-bg-alt { fill: #f0f3f5; stroke: #e1e4e6; stroke-width: 1px; rx: 12px; filter: drop-shadow(0px 4px 12px rgba(0,0,0,0.015)); }
      .text-main { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #1a1a1a; text-anchor: middle; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #4a5568; text-anchor: middle; }
      .icon { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 22px; fill: #1a1a1a; text-anchor: middle; }
    </style>
  </defs>

  <!-- Container Background -->
  <rect width="800" height="320" class="bg" />

  <!-- ================= MIDDLE SHELF ================= -->
  <!-- AI Box -->
  <g transform="translate(30, 30)">
    <rect width="234" height="115" class="box-bg" />
    <text x="117" y="52" class="icon">✦</text>
    <text x="117" y="80" class="text-main" font-size="11" letter-spacing="1.5">AI</text>
  </g>

  <!-- Web Development Box -->
  <g transform="translate(283, 30)">
    <rect width="234" height="115" class="box-bg" />
    <text x="117" y="52" class="icon">⎋</text>
    <text x="117" y="80" class="text-main" font-size="11" letter-spacing="1.5">WEB DEVELOPMENT</text>
  </g>

  <!-- Digital Box -->
  <g transform="translate(536, 30)">
    <rect width="234" height="115" class="box-bg" />
    <text x="117" y="52" class="icon">◈</text>
    <text x="117" y="80" class="text-main" font-size="11" letter-spacing="1.5">DIGITAL</text>
  </g>

  <!-- ================= BOTTOM SHELF ================= -->
  <!-- Products Box -->
  <g transform="translate(30, 165)">
    <rect width="173" height="125" class="box-bg" />
    <text x="86.5" y="70" class="text-sub" font-size="10" letter-spacing="1">PRODUCTS</text>
  </g>

  <!-- Business Strategy Box (Accent Box) -->
  <g transform="translate(221, 165)">
    <rect width="173" height="125" class="box-bg-alt" />
    <text x="86.5" y="70" class="text-sub" font-size="10" letter-spacing="1">BUSINESS STRATEGY</text>
  </g>

  <!-- Project Planning Box -->
  <g transform="translate(412, 165)">
    <rect width="173" height="125" class="box-bg" />
    <text x="86.5" y="70" class="text-sub" font-size="10" letter-spacing="1">PROJECT PLANNING</text>
  </g>

  <!-- Content Creation Box -->
  <g transform="translate(603, 165)">
    <rect width="167" height="125" class="box-bg" />
    <text x="83.5" y="70" class="text-sub" font-size="10" letter-spacing="1">CONTENT CREATION</text>
  </g>
</svg>

